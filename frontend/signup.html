<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hassan Traders - Sign Up</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .auth-container {
            background: #111827;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 400px;
            border: 1px solid #1f2937;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #fff;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #d1d5db;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background: #2563eb;
        }
        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
        .switch-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #9ca3af;
        }
        .switch-link a {
            color: #fbbf24;
            text-decoration: none;
        }
        .switch-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Hassan Traders</h2>
        <form id="signup-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signup-email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signup-password" required>
            </div>
            <button type="submit">Create Account</button>
        </form>
        <div id="signup-msg" class="message"></div>
        
        <div class="switch-link">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const msgBox = document.getElementById('signup-msg');

            try {
                const response = await fetch('https://hassan-traders-production.up.railway.app/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok || !data.success) {
                    msgBox.className = 'message error';
                    msgBox.innerText = data.message || 'Signup failed!';
                    return;
                }

                msgBox.className = 'message success';
                msgBox.innerText = 'Account created successfully! Redirecting to login...';
                document.getElementById('signup-form').reset();

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1200);

            } catch (err) {
                msgBox.className = 'message error';
                msgBox.innerText = 'Server connection error. Please try again later.';
            }
        });
    </script>
</body>
</html>
